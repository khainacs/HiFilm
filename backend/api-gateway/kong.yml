_format_version: "3.0"
_transform: true

services:
  - name: Security
    url: http://security-service:9001
    routes:
      - name: security-route
        paths:
          - /security
  - name: General
    url: http://general-service:9002
    routes:
      - name: general
        paths:
          - /general
  - name: ElasticSearch
    url: http://elasticSearch-service:9003
    routes:
      - name: elasticSearch-route
        paths:
          - /elasticSearch

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:5173
        - http://localhost:5000
        - http://localhost
      methods:
        - GET
        - POST
        - PUT
        - DELETE
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
        - Authorization
      private_network: true